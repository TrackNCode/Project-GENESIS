name: genesis
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.11
  - rdkit>=2023.09
  - pytorch>=2.1
  - cpuonly  # Automatic CPU support; if NVIDIA GPU present, pip will use CUDA
  - numpy<2.0
  - pandas>=2.0
  - scipy>=1.11
  - scikit-learn>=1.3
  - biopython>=1.81
  - requests>=2.31
  - pip
  - pip:
      - fastapi>=0.110.0
      - uvicorn>=0.28.0
      - pydantic>=2.6.0
      - sqlalchemy>=2.0.0
      - meeko>=0.5.0
      - datamol>=0.12.0
      - sentence-transformers>=2.5.0
      - faiss-cpu>=1.7.4
      - chemprop>=2.0.0
      - python-multipart
