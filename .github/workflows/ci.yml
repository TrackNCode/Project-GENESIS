name: ci
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Backend
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check backend
      - name: Run backend tests
        run: |
          pip install pytest
          pytest -q backend/tests

      # Frontend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Lint frontend (ESLint)
        run: |
          cd frontend
          npx eslint src --ext .tsx,.ts,.js,.jsx
      - name: Build frontend
        run: |
          cd frontend
          npm run build
